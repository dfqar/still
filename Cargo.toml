[workspace]
resolver = "2"
members = [
    "crates/still-renderer",
    "crates/still-core",
    "crates/still-scenes",
    "crates/still-ffi",
    "xtask",
]

[workspace.package]
version = "2.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
bytemuck = { version = "1.16", features = ["derive"] }
log = "0.4"
naga = { version = "=0.20.0", features = ["wgsl-in"] }
pollster = "0.3"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
wgpu = "=0.20.1"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
